<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infinite Whiteboard</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="cursor-crosshair">
  <canvas id="board"></canvas>
  <div id="eraserCursor"></div>
  <input type="file" id="imageInput" accept="image/*">

  <nav id="toolbar" aria-label="Drawing tools">
    <button class="tool-btn active" data-tool="select" title="Select (V)"><i class="fa-solid fa-arrow-pointer"></i><span class="shortcut">V</span></button>
    <button class="tool-btn" data-tool="hand" title="Pan (H)"><i class="fa-solid fa-hand"></i><span class="shortcut">H</span></button>
    <div class="tool-sep"></div>
    <button class="tool-btn" data-tool="pen" title="Pen (P)"><i class="fa-solid fa-pen"></i><span class="shortcut">P</span></button>
    <button class="tool-btn" data-tool="eraser" title="Eraser (E)"><i class="fa-solid fa-eraser"></i><span class="shortcut">E</span></button>
    <div class="tool-sep"></div>
    <button class="tool-btn" data-tool="line" title="Line (L)"><i class="fa-solid fa-minus" style="transform:rotate(-45deg)"></i><span class="shortcut">L</span></button>
    <button class="tool-btn" data-tool="arrow" title="Arrow (A)"><i class="fa-solid fa-arrow-right-long"></i><span class="shortcut">A</span></button>
    <button class="tool-btn" data-tool="rect" title="Rectangle (R)"><i class="fa-regular fa-square"></i><span class="shortcut">R</span></button>
    <button class="tool-btn" data-tool="ellipse" title="Ellipse (O)"><i class="fa-regular fa-circle"></i><span class="shortcut">O</span></button>
    <div class="tool-sep"></div>
    <button class="tool-btn" data-tool="text" title="Text (T)"><i class="fa-solid fa-t"></i><span class="shortcut">T</span></button>
    <button class="tool-btn" data-tool="sticky" title="Sticky Note (S)"><i class="fa-solid fa-note-sticky"></i><span class="shortcut">S</span></button>
    <button class="tool-btn" data-tool="image" title="Image"><i class="fa-solid fa-image"></i></button>
  </nav>

  <div id="topbar">
    <div id="colorSwatches" style="display:flex;gap:4px;align-items:center;"></div>
    <div class="opt-sep"></div>
    <div id="strokeWidths" style="display:flex;gap:3px;align-items:center;"></div>
    <div class="opt-sep"></div>
    <button class="fill-toggle" id="fillToggle" title="Fill shapes"><i class="fa-solid fa-fill-drip"></i></button>
    <div class="opt-sep"></div>
    <button class="action-btn" id="undoBtn" title="Undo"><i class="fa-solid fa-rotate-left"></i></button>
    <button class="action-btn" id="redoBtn" title="Redo"><i class="fa-solid fa-rotate-right"></i></button>
    <button class="action-btn danger" id="clearBtn" title="Clear all"><i class="fa-solid fa-xmark"></i></button>
    <div class="opt-sep"></div>
    <button class="action-btn" id="optionsBtn" title="Options"><i class="fa-solid fa-gear"></i></button>
  </div>

  <section id="optionsPanel" aria-label="Options">
    <div class="options-head">
      <h2>Options</h2>
      <button class="options-close" id="optionsClose" title="Close options"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="options-section">
      <label class="option-color"><span>Accent</span><input type="color" id="accentColor" value="#10b981"></label>
      <label class="option-color"><span>Board</span><input type="color" id="canvasColor" value="#1a1a1f"></label>
      <label class="option-color"><span>Pattern</span><input type="color" id="gridColor" value="#28282f"></label>
    </div>
    <div class="options-section">
      <label class="option-field">
        <span>Background Pattern</span>
        <select id="bgPattern">
          <option value="dots">Dots</option>
          <option value="grid">Grid</option>
          <option value="none">None</option>
        </select>
      </label>
    </div>
    <div class="options-section">
      <div class="option-title">Boards</div>
      <div class="board-manager">
        <label class="option-field">
          <span>Current Board</span>
          <select id="boardSelect"></select>
        </label>
        <div class="board-actions">
          <button class="board-btn" id="newBoardBtn" type="button"><i class="fa-solid fa-plus"></i><span>New</span></button>
          <button class="board-btn" id="loadBoardBtn" type="button"><i class="fa-solid fa-folder-open"></i><span>Load</span></button>
          <button class="board-btn" id="exportBoardBtn" type="button"><i class="fa-solid fa-file-export"></i><span>Export</span></button>
        </div>
        <button class="board-btn board-btn-wide" id="importBoardBtn" type="button"><i class="fa-solid fa-file-import"></i><span>Load from file</span></button>
        <input type="file" id="importBoardInput" accept="application/json,.json" style="display:none;">
      </div>
    </div>
    <div class="options-section">
      <div class="option-title">Tool Shortcuts</div>
      <div id="keybindList" class="keybind-list"></div>
    </div>
    <button class="options-reset" id="resetOptions">Reset options</button>
  </section>

  <div id="itemPopup">
  <div class="popup-row" id="popTextRow" style="display:none;">
    <button class="pbtn" id="popBold" title="Bold (Ctrl+B)" style="font-weight:700;">B</button>
    <button class="pbtn" id="popItalic" title="Italic (Ctrl+I)" style="font-style:italic;font-weight:400;">I</button>
    <button class="pbtn" id="popUnder" title="Underline (Ctrl+U)" style="text-decoration:underline;font-weight:400;">U</button>
    <div class="popup-sep"></div>
    <button class="pbtn" id="popSizeDn" title="Smaller font" style="font-size:11px;font-weight:400;">A-</button>
    <span id="popFontSize">20</span>
    <button class="pbtn" id="popSizeUp" title="Bigger font" style="font-size:14px;font-weight:400;">A+</button>
    <div class="popup-sep"></div>
    <button class="pbtn" id="popEditText" title="Edit text (select characters to color)"><i class="fa-solid fa-pen-to-square" style="font-size:11px;"></i></button>
  </div>
  <div class="popup-row" id="popColorRow" style="display:none;"><div class="pop-color-picker-wrap"><input type="color" id="popCustomColor" value="#e4e4e8" title="Custom color"><i class="fa-solid fa-palette" style="font-size:11px;pointer-events:none;position:absolute;"></i></div></div>
  <div class="popup-row" id="popStickyRow" style="display:none;"></div>
  <div class="popup-row" id="popArrowRow" style="display:none;">
    <button class="pbtn" id="popArrowStart" title="Arrow at start"><i class="fa-solid fa-left-long"></i></button>
    <button class="pbtn" id="popArrowEnd" title="Arrow at end"><i class="fa-solid fa-right-long"></i></button>
    <button class="pbtn" id="popArrowBoth" title="Arrows at both ends"><i class="fa-solid fa-left-right"></i></button>
    <button class="pbtn" id="popArrowNone" title="No arrowheads"><i class="fa-solid fa-minus"></i></button>
  </div>
  <div class="popup-row" id="popGroupRow" style="display:none;">
    <button class="pbtn pbtn-wide" id="popGroup" title="Group selected objects"><i class="fa-solid fa-object-group"></i><span>Group</span></button>
    <button class="pbtn pbtn-wide" id="popUngroup" title="Ungroup selected objects"><i class="fa-solid fa-object-ungroup"></i><span>Ungroup</span></button>
  </div>
  <div class="popup-row">
    <button class="pbtn" id="popColorsBtn" title="Show colors"><i class="fa-solid fa-palette" style="font-size:11px;"></i></button>
    <div class="pop-dropdown-wrap">
      <button class="pbtn" id="popOpacityBtn" title="Opacity"><i class="fa-solid fa-droplet" style="font-size:11px;"></i></button>
      <div class="pop-dropdown" id="popOpacityDropdown">
        <div class="pop-dropdown-label">Opacity</div>
        <div class="pop-dropdown-slider-row">
          <input type="range" id="popOpacity" min="0" max="1" step="0.05" value="1">
          <span id="popOpacityVal">100%</span>
        </div>
      </div>
    </div>
    <div class="pop-dropdown-wrap">
      <button class="pbtn" id="popStrokeBtn" title="Stroke Weight"><i class="fa-solid fa-pen" style="font-size:11px;"></i></button>
      <div class="pop-dropdown" id="popStrokeDropdown">
        <div class="pop-dropdown-label" id="popStrokeLabel">Stroke</div>
        <div class="pop-dropdown-slider-row">
          <input type="range" id="popStrokeWeight" min="1" max="20" step="0.5" value="2">
          <span id="popStrokeVal">2</span>
        </div>
      </div>
    </div>
    <div class="pop-dropdown-wrap">
      <button class="pbtn" id="popFillBtn" title="Fill"><i class="fa-solid fa-fill-drip" style="font-size:11px;"></i></button>
      <div class="pop-dropdown pop-fill-dropdown" id="popFillDropdown">
        <div class="pop-dropdown-label">Fill</div>
        <label class="pop-check-row"><input type="checkbox" id="popFillEnabled"> <span>Enabled</span></label>
        <div class="pop-fill-color-row">
          <span>Color</span>
          <input type="color" id="popFillColor" value="#e4e4e8">
        </div>
        <div class="pop-dropdown-slider-row pop-fill-opacity-row">
          <input type="range" id="popFillOpacity" min="0" max="1" step="0.05" value="0.3">
          <span id="popFillOpacityVal">30%</span>
        </div>
        <div class="pop-dropdown-slider-row pop-fill-opacity-row">
          <input type="range" id="popGrainIntensity" min="0" max="1" step="0.05" value="0.6">
          <span id="popGrainIntensityVal">60%</span>
        </div>
        <div class="pop-fill-style-grid" id="popFillStyles">
          <button class="fill-style-btn" data-fill-style="solid" type="button">Solid</button>
          <button class="fill-style-btn" data-fill-style="grain" type="button">Grain</button>
          <button class="fill-style-btn" data-fill-style="crosshatch" type="button">Hatch</button>
        </div>
      </div>
    </div>
    <div class="popup-sep"></div>
    <button class="pbtn" id="popLayerUp" title="Bring forward"><i class="fa-solid fa-chevron-up" style="font-size:11px;"></i></button>
    <button class="pbtn" id="popLayerDn" title="Send backward"><i class="fa-solid fa-chevron-down" style="font-size:11px;"></i></button>
    <div class="popup-sep"></div>
    <button class="pbtn danger" id="popDelete" title="Delete"><i class="fa-solid fa-trash-can" style="font-size:11px;"></i></button>
  </div>
  </div>

  <div id="bottombar">
  <button class="zoom-btn" id="zoomOut"><i class="fa-solid fa-minus"></i></button>
  <span id="zoomLevel">100%</span>
  <button class="zoom-btn" id="zoomIn"><i class="fa-solid fa-plus"></i></button>
  <div class="opt-sep" style="height:20px;margin:0 2px;"></div>
  <button class="zoom-btn" id="fitView" title="Fit to content"><i class="fa-solid fa-expand"></i></button>
  <button class="zoom-btn" id="locateBtn" title="Show all objects"><i class="fa-solid fa-crosshairs"></i></button>
  <div class="opt-sep" style="height:20px;margin:0 2px;"></div>
  <button class="zoom-btn" id="saveViewBookmark" title="Save current view"><i class="fa-solid fa-bookmark"></i><i class="fa-solid fa-plus bookmark-plus"></i></button>
  <button class="zoom-btn" id="viewBookmarksBtn" title="Saved views"><i class="fa-solid fa-list"></i></button>
  </div>

  <section id="viewBookmarksPanel" aria-label="Saved views">
    <div class="view-bookmarks-head">
      <h2>Saved views</h2>
    </div>
    <div id="viewBookmarksList"></div>
  </section>

  <div id="textEditor" contenteditable="true" spellcheck="false"></div>
  <textarea id="stickyEditor" spellcheck="false"></textarea>
  <div id="toasts"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
