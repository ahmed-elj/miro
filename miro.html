<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infinite Whiteboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#141417;--canvas:#1a1a1f;--panel:#1e1e24;--border:#2a2a32;--fg:#e4e4e8;--muted:#6b6b78;--accent:#10b981;--accent-dim:rgba(16,185,129,0.15);--danger:#ef4444;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--fg);overflow:hidden;height:100vh;width:100vw;}
canvas#board{position:absolute;inset:0;display:block;}
#toolbar{position:absolute;left:16px;top:50%;transform:translateY(-50%);background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:6px;display:flex;flex-direction:column;gap:2px;z-index:20;box-shadow:0 4px 24px rgba(0,0,0,0.4);}
.tool-btn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:10px;border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:15px;transition:background .15s,color .15s;position:relative;}
.tool-btn:hover{background:var(--border);color:var(--fg);}
.tool-btn.active{background:var(--accent-dim);color:var(--accent);}
.tool-sep{width:28px;height:1px;background:var(--border);margin:4px auto;}
.tool-btn .shortcut{position:absolute;right:3px;bottom:2px;font-size:8px;color:var(--muted);font-weight:600;pointer-events:none;}
#topbar{position:absolute;top:16px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:6px 12px;display:flex;align-items:center;gap:8px;z-index:20;box-shadow:0 4px 24px rgba(0,0,0,0.4);white-space:nowrap;}
.opt-sep{width:1px;height:28px;background:var(--border);flex-shrink:0;}
.color-swatch{width:22px;height:22px;border-radius:7px;border:2px solid transparent;cursor:pointer;transition:border-color .15s,transform .15s;flex-shrink:0;}
.color-swatch:hover{transform:scale(1.15);}
.color-swatch.active{border-color:var(--fg);}
.stroke-btn{width:30px;height:30px;border-radius:7px;border:1px solid var(--border);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;}
.stroke-btn:hover{background:var(--border);}
.stroke-btn.active{background:var(--accent-dim);border-color:var(--accent);}
.stroke-dot{border-radius:50%;background:var(--fg);}
.fill-toggle{width:30px;height:30px;border-radius:7px;border:1px solid var(--border);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);transition:all .15s;}
.fill-toggle:hover{background:var(--border);}
.fill-toggle.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);}
.action-btn{width:30px;height:30px;border-radius:7px;border:1px solid var(--border);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted);transition:all .15s;}
.action-btn:hover{background:var(--border);color:var(--fg);}
.action-btn.danger:hover{background:rgba(239,68,68,0.15);color:var(--danger);border-color:var(--danger);}
#bottombar{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:5px 8px;display:flex;align-items:center;gap:4px;z-index:20;box-shadow:0 4px 24px rgba(0,0,0,0.4);}
.zoom-btn{width:32px;height:32px;border-radius:8px;border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.zoom-btn:hover{background:var(--border);color:var(--fg);}
#zoomLevel{font-size:12px;font-weight:600;color:var(--fg);min-width:60px;text-align:center;cursor:pointer;user-select:none;}
#textEditor{position:absolute;z-index:30;display:none;background:transparent;border:none;outline:none;font-family:'Space Grotesk',sans-serif;padding:4px 6px;min-width:60px;min-height:28px;overflow:hidden;line-height:1.4;border-radius:4px;color:var(--fg);white-space:pre-wrap;word-wrap:break-word;caret-color:var(--accent);}
#stickyEditor{position:absolute;z-index:30;display:none;border:none;outline:none;resize:none;font-family:'Space Grotesk',sans-serif;padding:14px;overflow:hidden;line-height:1.5;border-radius:6px;box-shadow:0 2px 12px rgba(0,0,0,0.3);}
#toasts{position:fixed;top:80px;right:20px;z-index:100;display:flex;flex-direction:column;gap:8px;}
.toast-msg{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 18px;font-size:13px;color:var(--fg);transform:translateX(120%);transition:transform .3s cubic-bezier(.22,1,.36,1);box-shadow:0 4px 16px rgba(0,0,0,0.3);}
.toast-msg.show{transform:translateX(0);}
.cursor-crosshair canvas{cursor:crosshair;}.cursor-grab canvas{cursor:grab;}.cursor-grabbing canvas{cursor:grabbing;}.cursor-text canvas{cursor:text;}.cursor-default canvas{cursor:default;}.cursor-eraser canvas{cursor:none;}
#eraserCursor{position:absolute;pointer-events:none;z-index:25;border:2px solid rgba(255,255,255,0.5);border-radius:50%;display:none;transform:translate(-50%,-50%);}
#imageInput{display:none;}
#itemPopup{position:absolute;z-index:35;display:none;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:8px 10px;box-shadow:0 8px 32px rgba(0,0,0,0.5);pointer-events:auto;flex-direction:column;gap:5px;align-items:stretch;}
#itemPopup.visible{display:flex;}
.popup-row{display:flex;align-items:center;gap:4px;flex-wrap:nowrap;}
.popup-sep{width:1px;height:22px;background:var(--border);flex-shrink:0;margin:0 2px;}
.pbtn{width:28px;height:28px;border-radius:7px;border:1px solid var(--border);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted);transition:all .12s;font-family:'Space Grotesk',sans-serif;font-weight:700;}
.pbtn:hover{background:var(--border);color:var(--fg);}
.pbtn.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);}
.pbtn.danger:hover{background:rgba(239,68,68,0.15);color:var(--danger);border-color:var(--danger);}
.pswatch{width:18px;height:18px;border-radius:5px;border:2px solid transparent;cursor:pointer;transition:border-color .12s;flex-shrink:0;}
.pswatch:hover{border-color:rgba(255,255,255,0.3);}
#popOpacity{-webkit-appearance:none;appearance:none;width:70px;height:4px;border-radius:2px;background:var(--border);outline:none;cursor:pointer;}
#popOpacity::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid var(--panel);}
#popFontSize{font-size:11px;font-weight:600;color:var(--fg);min-width:26px;text-align:center;user-select:none;}
</style>
</head>
<body class="cursor-crosshair">
<canvas id="board"></canvas>
<div id="eraserCursor"></div>
<input type="file" id="imageInput" accept="image/*">
<nav id="toolbar" aria-label="Drawing tools">
  <button class="tool-btn active" data-tool="select" title="Select (V)"><i class="fa-solid fa-arrow-pointer"></i><span class="shortcut">V</span></button>
  <button class="tool-btn" data-tool="hand" title="Pan (H)"><i class="fa-solid fa-hand"></i><span class="shortcut">H</span></button>
  <div class="tool-sep"></div>
  <button class="tool-btn" data-tool="pen" title="Pen (P)"><i class="fa-solid fa-pen"></i><span class="shortcut">P</span></button>
  <button class="tool-btn" data-tool="eraser" title="Eraser (E)"><i class="fa-solid fa-eraser"></i><span class="shortcut">E</span></button>
  <div class="tool-sep"></div>
  <button class="tool-btn" data-tool="line" title="Line (L)"><i class="fa-solid fa-minus" style="transform:rotate(-45deg)"></i><span class="shortcut">L</span></button>
  <button class="tool-btn" data-tool="arrow" title="Arrow (A)"><i class="fa-solid fa-arrow-right-long"></i><span class="shortcut">A</span></button>
  <button class="tool-btn" data-tool="rect" title="Rectangle (R)"><i class="fa-regular fa-square"></i><span class="shortcut">R</span></button>
  <button class="tool-btn" data-tool="ellipse" title="Ellipse (O)"><i class="fa-regular fa-circle"></i><span class="shortcut">O</span></button>
  <div class="tool-sep"></div>
  <button class="tool-btn" data-tool="text" title="Text (T)"><i class="fa-solid fa-t"></i><span class="shortcut">T</span></button>
  <button class="tool-btn" data-tool="sticky" title="Sticky Note (S)"><i class="fa-solid fa-note-sticky"></i><span class="shortcut">S</span></button>
  <button class="tool-btn" data-tool="image" title="Image"><i class="fa-solid fa-image"></i></button>
</nav>
<div id="topbar">
  <div id="colorSwatches" style="display:flex;gap:4px;align-items:center;"></div>
  <div class="opt-sep"></div>
  <div id="strokeWidths" style="display:flex;gap:3px;align-items:center;"></div>
  <div class="opt-sep"></div>
  <button class="fill-toggle" id="fillToggle" title="Fill shapes"><i class="fa-solid fa-fill-drip"></i></button>
  <div class="opt-sep"></div>
  <button class="action-btn" id="undoBtn" title="Undo"><i class="fa-solid fa-rotate-left"></i></button>
  <button class="action-btn" id="redoBtn" title="Redo"><i class="fa-solid fa-rotate-right"></i></button>
  <button class="action-btn danger" id="clearBtn" title="Clear all"><i class="fa-solid fa-xmark"></i></button>
</div>
<div id="itemPopup">
  <div class="popup-row" id="popTextRow" style="display:none;">
    <button class="pbtn" id="popBold" title="Bold (Ctrl+B)" style="font-weight:700;">B</button>
    <button class="pbtn" id="popItalic" title="Italic (Ctrl+I)" style="font-style:italic;font-weight:400;">I</button>
    <button class="pbtn" id="popUnder" title="Underline (Ctrl+U)" style="text-decoration:underline;font-weight:400;">U</button>
    <div class="popup-sep"></div>
    <button class="pbtn" id="popSizeDn" title="Smaller font" style="font-size:11px;font-weight:400;">A-</button>
    <span id="popFontSize">20</span>
    <button class="pbtn" id="popSizeUp" title="Bigger font" style="font-size:14px;font-weight:400;">A+</button>
  </div>
  <div class="popup-row" id="popColorRow"></div>
  <div class="popup-row" id="popStickyRow" style="display:none;"></div>
  <div class="popup-row">
    <i class="fa-solid fa-droplet" style="font-size:10px;color:var(--muted);margin-right:2px;"></i>
    <input type="range" id="popOpacity" min="0" max="1" step="0.05" value="1">
    <div class="popup-sep"></div>
    <button class="pbtn" id="popLayerUp" title="Bring forward"><i class="fa-solid fa-chevron-up" style="font-size:11px;"></i></button>
    <button class="pbtn" id="popLayerDn" title="Send backward"><i class="fa-solid fa-chevron-down" style="font-size:11px;"></i></button>
    <div class="popup-sep"></div>
    <button class="pbtn danger" id="popDelete" title="Delete"><i class="fa-solid fa-trash-can" style="font-size:11px;"></i></button>
  </div>
</div>
<div id="bottombar">
  <button class="zoom-btn" id="zoomOut"><i class="fa-solid fa-minus"></i></button>
  <span id="zoomLevel">100%</span>
  <button class="zoom-btn" id="zoomIn"><i class="fa-solid fa-plus"></i></button>
  <div class="opt-sep" style="height:20px;margin:0 2px;"></div>
  <button class="zoom-btn" id="fitView" title="Fit to content"><i class="fa-solid fa-expand"></i></button>
</div>
<div id="textEditor" contenteditable="true" spellcheck="false"></div>
<textarea id="stickyEditor" spellcheck="false"></textarea>
<div id="toasts"></div>

<script>
var canvas = document.getElementById('board');
var ctx = canvas.getContext('2d');
var dpr = window.devicePixelRatio || 1;
var COLORS = ['#e4e4e8','#6b6b78','#ef4444','#f97316','#eab308','#22c55e','#10b981','#06b6d4','#818cf8','#c084fc','#f472b6','#fbbf24'];
var STICKY_COLORS = ['#fbbf24','#fb923c','#f87171','#a78bfa','#60a5fa','#34d399'];
var STROKE_WIDTHS = [1, 2, 4, 8];
var MIN_ZOOM = 0.0001, MAX_ZOOM = 100000, HS = 8, HH = 22;

var cam = { x: 0, y: 0, zoom: 1 };
var objects = [];
var selectedId = null;
var curTool = 'select';
var curColor = '#e4e4e8';
var curStroke = 2;
var fillOn = false;
var isDrawing = false, drawSt = null, drawCur = null, curPath = [];
var dragMode = null, dragSW = null, dragSnap = null, dragUndo = false;
var isPan = false, panSt = null, panCamSt = null;
var spaceHeld = false, toolBefore = null;
var undoSt = [], redoSt = [], MAX_UNDO = 80;
var isEditing = false, editId = null;
var nid = 1;
var imgCache = {};

function gid() { return nid++; }
function resizeCanvas() { canvas.width = window.innerWidth * dpr; canvas.height = window.innerHeight * dpr; canvas.style.width = window.innerWidth + 'px'; canvas.style.height = window.innerHeight + 'px'; reqR(); }
window.addEventListener('resize', resizeCanvas);
function s2w(sx, sy) { return { x: (sx - cam.x) / cam.zoom, y: (sy - cam.y) / cam.zoom }; }
function w2s(wx, wy) { return { x: wx * cam.zoom + cam.x, y: wy * cam.zoom + cam.y }; }

var rrf = false;
function reqR() { if (!rrf) { rrf = true; requestAnimationFrame(function() { render(); rrf = false; }); } }

function render() {
  var w = canvas.width / dpr, h = canvas.height / dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#1a1a1f'; ctx.fillRect(0, 0, w, h);
  ctx.save(); ctx.translate(cam.x, cam.y); ctx.scale(cam.zoom, cam.zoom);
  drawGrid(w, h);
  for (var i = 0; i < objects.length; i++) {
    // Skip the object being edited — the HTML editor replaces it
    if (isEditing && objects[i].id === editId) continue;
    drawObj(ctx, objects[i]);
  }
  if (isDrawing) drawPreview(ctx);
  if (selectedId !== null && !isEditing) drawHandles(ctx);
  ctx.restore();
  if (!objects.length && !isDrawing) {
    ctx.fillStyle = '#3a3a44'; ctx.font = '500 18px Space Grotesk'; ctx.textAlign = 'center';
    ctx.fillText('Pick a tool and start drawing', w / 2, h / 2);
    ctx.font = '400 13px Space Grotesk'; ctx.fillStyle = '#2a2a32';
    ctx.fillText('Scroll to zoom \u00B7 Space to pan \u00B7 Ctrl+Z to undo', w / 2, h / 2 + 30);
    ctx.textAlign = 'left';
  }
  updatePopup();
}

function drawGrid(sw, sh) {
  var ws = 36 / cam.zoom, mag = Math.pow(10, Math.floor(Math.log10(ws))), n = ws / mag;
  var gs = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * mag;
  var tl = s2w(0, 0), br = s2w(sw, sh), sx = Math.floor(tl.x / gs) * gs, sy = Math.floor(tl.y / gs) * gs;
  ctx.fillStyle = '#28282f'; var dr = 1 / cam.zoom;
  for (var x = sx; x <= br.x; x += gs) for (var y = sy; y <= br.y; y += gs) { ctx.beginPath(); ctx.arc(x, y, dr, 0, Math.PI * 2); ctx.fill(); }
}

/* === SPAN HELPERS === */
function getSpans(obj) {
  if (obj.spans) return obj.spans;
  return [{ text: obj.text || '', bold: obj.fontWeight === '700', italic: obj.fontStyle === 'italic', underline: !!obj.underline, color: obj.color || '#e4e4e8' }];
}
function spansToHtml(spans) {
  var parts = [];
  spans.forEach(function(s) {
    var lines = s.text.split('\n');
    lines.forEach(function(line, li) {
      if (li > 0) parts.push('<br>');
      if (!line) return;
      var h = line.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      if (s.italic) h = '<i>' + h + '</i>';
      if (s.bold) h = '<b>' + h + '</b>';
      if (s.underline) h = '<u>' + h + '</u>';
      if (s.color && s.color !== '#e4e4e8') h = '<span style="color:' + s.color + '">' + h + '</span>';
      parts.push(h);
    });
  });
  return parts.join('') || '<br>';
}
function rgbToHex(c) { if (!c) return c; if (c.startsWith('#')) return c; var m = c.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/); if (!m) return c; return '#' + [m[1], m[2], m[3]].map(function(x) { return parseInt(x).toString(16).padStart(2, '0'); }).join(''); }
function parseHtmlSpans(el, defColor) {
  var spans = [];
  function walk(node, b, it, un, col) {
    if (node.nodeType === Node.TEXT_NODE) { var t = node.textContent; if (t) spans.push({ text: t, bold: b, italic: it, underline: un, color: col }); }
    else if (node.nodeType === Node.ELEMENT_NODE) {
      var tag = node.tagName.toLowerCase(), nb = b, ni = it, nu = un, nc = col;
      if (tag === 'b' || tag === 'strong') nb = true; if (tag === 'i' || tag === 'em') ni = true; if (tag === 'u') nu = true;
      if (tag === 'br') { spans.push({ text: '\n', bold: b, italic: it, underline: un, color: col }); return; }
      if ((tag === 'div' || tag === 'p') && spans.length > 0) { var last = spans[spans.length - 1]; if (!last.text.endsWith('\n')) spans.push({ text: '\n', bold: b, italic: it, underline: un, color: col }); }
      if (node.style) { if (node.style.color) nc = rgbToHex(node.style.color); if (node.style.fontWeight === '700' || node.style.fontWeight === 'bold') nb = true; if (node.style.fontStyle === 'italic') ni = true; if (node.style.textDecoration && node.style.textDecoration.includes('underline')) nu = true; }
      for (var ci = 0; ci < node.childNodes.length; ci++) walk(node.childNodes[ci], nb, ni, nu, nc);
    }
  }
  for (var ci2 = 0; ci2 < el.childNodes.length; ci2++) walk(el.childNodes[ci2], false, false, false, defColor);
  var merged = [];
  spans.forEach(function(s) { if (merged.length > 0) { var p = merged[merged.length - 1]; if (p.bold === s.bold && p.italic === s.italic && p.underline === s.underline && p.color === s.color) { p.text += s.text; return; } } merged.push({ text: s.text, bold: s.bold, italic: s.italic, underline: s.underline, color: s.color }); });
  return merged;
}

/* === DRAW OBJECTS === */
function drawObj(c, obj) {
  c.save(); c.globalAlpha = obj.opacity != null ? obj.opacity : 1; c.lineCap = 'round'; c.lineJoin = 'round';
  switch (obj.type) { case 'path': dPath(c, obj); break; case 'line': dLine(c, obj); break; case 'arrow': dArrow(c, obj); break; case 'rect': dRect(c, obj); break; case 'ellipse': dEllipse(c, obj); break; case 'text': dText(c, obj); break; case 'sticky': dSticky(c, obj); break; case 'image': dImage(c, obj); break; }
  c.restore();
}
function dPath(c, o) { if (o.points.length < 2) return; c.strokeStyle = o.color; c.lineWidth = o.strokeWidth; c.beginPath(); c.moveTo(o.points[0].x, o.points[0].y); if (o.points.length === 2) c.lineTo(o.points[1].x, o.points[1].y); else { for (var i = 1; i < o.points.length - 1; i++) { var mx = (o.points[i].x + o.points[i + 1].x) / 2, my = (o.points[i].y + o.points[i + 1].y) / 2; c.quadraticCurveTo(o.points[i].x, o.points[i].y, mx, my); } c.lineTo(o.points[o.points.length - 1].x, o.points[o.points.length - 1].y); } c.stroke(); }
function dLine(c, o) { c.strokeStyle = o.color; c.lineWidth = o.strokeWidth; c.beginPath(); c.moveTo(o.x1, o.y1); c.lineTo(o.x2, o.y2); c.stroke(); }
function dArrow(c, o) {
  c.strokeStyle = o.color; c.lineWidth = o.strokeWidth; c.beginPath(); c.moveTo(o.x1, o.y1); c.lineTo(o.x2, o.y2); c.stroke();
  var len = Math.hypot(o.x2 - o.x1, o.y2 - o.y1); if (len < 1) return;
  var hl = Math.min(len * 0.25, Math.max(o.strokeWidth * 4, len * 0.12));
  var a = Math.atan2(o.y2 - o.y1, o.x2 - o.x1), hw = Math.max(0.3, 0.4 - (hl / len) * 0.2);
  c.beginPath(); c.moveTo(o.x2, o.y2); c.lineTo(o.x2 - hl * Math.cos(a - hw), o.y2 - hl * Math.sin(a - hw)); c.moveTo(o.x2, o.y2); c.lineTo(o.x2 - hl * Math.cos(a + hw), o.y2 - hl * Math.sin(a + hw)); c.stroke();
}
function dRect(c, o) { if (o.fill) { c.fillStyle = o.fillColor; c.fillRect(o.x, o.y, o.w, o.h); } c.strokeStyle = o.color; c.lineWidth = o.strokeWidth; c.strokeRect(o.x, o.y, o.w, o.h); }
function dEllipse(c, o) { c.beginPath(); c.ellipse(o.x + o.w / 2, o.y + o.h / 2, Math.max(0.1, Math.abs(o.w / 2)), Math.max(0.1, Math.abs(o.h / 2)), 0, 0, Math.PI * 2); if (o.fill) { c.fillStyle = o.fillColor; c.fill(); } c.strokeStyle = o.color; c.lineWidth = o.strokeWidth; c.stroke(); }

function dText(c, o) {
  var spans = getSpans(o), minR = 14, rS = Math.max(minR, o.fontSize), sc = o.fontSize / rS;
  c.save(); c.translate(o.x, o.y); c.scale(sc, sc); c.textBaseline = 'top';
  var lines = [[]];
